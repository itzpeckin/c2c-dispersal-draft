<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C2C Official Lottery</title>
<style>
:root{--bg:#0c1020;--panel:#171c31;--text:#f7f8ff;--muted:#aeb6d0;--accent:#7658ff;--line:#313957}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#283054,#0c1020 50%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
main{max-width:1180px;margin:auto;padding:26px}h1{margin:0}.sub{color:var(--muted);margin:7px 0 20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.panel{background:rgba(23,28,49,.96);border:1px solid var(--line);border-radius:18px;padding:18px}.wheelbox{position:relative;display:grid;place-items:center}
canvas{width:min(100%,560px);height:auto}.pointer{position:absolute;top:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid white;z-index:2}
.center{position:absolute;width:105px;height:105px;border-radius:50%;background:white;color:#11162b;display:grid;place-items:center;text-align:center;font-weight:900;border:7px solid var(--accent)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#303957;color:white}button:disabled{opacity:.45}
.status{text-align:center;font-size:20px;font-weight:800;min-height:48px;margin-top:8px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px;background:#202743;border-radius:10px}
.ball{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:900}.muted{color:var(--muted);font-size:12px}h2{font-size:18px;margin:0 0 12px}.gap{margin-top:18px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>C2C Dispersal Draft Lottery</h1><div class="sub">Option A weighted lottery · winner and all lottery balls removed after each pick · official seed 692026</div>
<div class="grid"><section class="panel"><div class="wheelbox"><div class="pointer"></div><canvas id="c" width="900" height="900"></canvas><div class="center" id="center">156<br>balls</div></div>
<div class="status" id="status">Ready for Pick #1</div><div class="controls"><button class="primary" id="spin">Spin for Pick #1</button><button class="secondary" id="all">Run Full Lottery</button><button class="secondary" id="reset">Reset Replay</button></div></section>
<aside><section class="panel"><h2>Remaining Lottery Balls</h2><div class="list" id="odds"></div></section><section class="panel gap"><h2>Official Draft Order</h2><div class="list" id="results"></div></section></aside></div>
<script>
const original={"erics2423": 24, "Peckin": 21, "BenMoore13": 18, "BKnappy": 14, "PiratesJs": 13, "CalBrewski": 12, "LouGarou": 10, "YoByronWatkins": 10, "Jonredcorn08": 10, "Jimmer44": 9, "Vandorjp": 9, "Tsummers3": 6}, draws=[{"pick": 1, "winner": "LouGarou", "ball": 110, "pool": 156}, {"pick": 2, "winner": "erics2423", "ball": 5, "pool": 146}, {"pick": 3, "winner": "PiratesJs", "ball": 55, "pool": 122}, {"pick": 4, "winner": "CalBrewski", "ball": 56, "pool": 109}, {"pick": 5, "winner": "Vandorjp", "ball": 90, "pool": 97}, {"pick": 6, "winner": "Jimmer44", "ball": 76, "pool": 88}, {"pick": 7, "winner": "Peckin", "ball": 2, "pool": 79}, {"pick": 8, "winner": "YoByronWatkins", "ball": 38, "pool": 58}, {"pick": 9, "winner": "BKnappy", "ball": 25, "pool": 48}, {"pick": 10, "winner": "Jonredcorn08", "ball": 24, "pool": 34}, {"pick": 11, "winner": "BenMoore13", "ball": 2, "pool": 24}, {"pick": 12, "winner": "Tsummers3", "ball": 4, "pool": 6}];
let remaining={...original}, current=0, angle=0, busy=false;
const c=document.getElementById('c'),ctx=c.getContext('2d'),status=document.getElementById('status'),spin=document.getElementById('spin'),all=document.getElementById('all'),center=document.getElementById('center');
function entries(){return Object.entries(remaining)}
function wheel(){const list=entries(),total=list.reduce((s,x)=>s+x[1],0),cx=450,cy=450,r=395;ctx.clearRect(0,0,900,900);let start=angle;list.forEach(([name,count],i)=>{const arc=Math.PI*2*count/total;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+arc);ctx.closePath();ctx.fillStyle=`hsl(${(255+i*43)%360} 67% 55%)`;ctx.fill();ctx.strokeStyle='#11162b';ctx.lineWidth=4;ctx.stroke();const mid=start+arc/2;ctx.save();ctx.translate(cx+Math.cos(mid)*r*.69,cy+Math.sin(mid)*r*.69);ctx.rotate(mid+Math.PI/2);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='700 20px Arial';ctx.fillText(name,0,0);ctx.font='600 15px Arial';ctx.fillText(count+' balls',0,23);ctx.restore();start+=arc});center.innerHTML=total+'<br>balls'}
function render(){const total=Object.values(remaining).reduce((a,b)=>a+b,0);document.getElementById('odds').innerHTML=entries().sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row"><div class="ball">${v}</div><div><strong>${n}</strong><div class="muted">${(v/total*100).toFixed(1)}% next-pick odds</div></div><b>${v} / ${total}</b></div>`).join('');document.getElementById('results').innerHTML=draws.map((d,i)=>`<div class="row" style="opacity:${i<current?1:.3}"><div class="ball">${d.pick}</div><div><strong>${i<current?d.winner:'Pending'}</strong><div class="muted">${i<current?'Winning ball '+d.ball+' of '+d.pool:''}</div></div><b>${i<current?'Selected':''}</b></div>`).join('')}
function once(){if(busy||current>=12)return Promise.resolve();busy=true;spin.disabled=all.disabled=true;const d=draws[current],list=entries(),total=list.reduce((s,x)=>s+x[1],0);let acc=0,target=0;for(const [n,v] of list){const arc=Math.PI*2*v/total;if(n===d.winner){target=-Math.PI/2-(acc+arc/2);break}acc+=arc}const from=angle,to=target+Math.PI*2*(6+current%3),start=performance.now();return new Promise(resolve=>{function frame(now){const t=Math.min(1,(now-start)/2300),e=1-Math.pow(1-t,4);angle=from+(to-from)*e;wheel();if(t<1)requestAnimationFrame(frame);else{delete remaining[d.winner];current++;render();wheel();status.textContent=current<12?`Pick #${d.pick}: ${d.winner} · Next Pick #${current+1}`:`Pick #${d.pick}: ${d.winner} · Lottery complete`;spin.textContent=current<12?'Spin for Pick #'+(current+1):'Lottery Complete';busy=false;spin.disabled=all.disabled=current>=12;resolve()}}requestAnimationFrame(frame)})}
async function runAll(){while(current<12){await once();await new Promise(r=>setTimeout(r,500))}}
function reset(){remaining={...original};current=0;angle=0;busy=false;spin.disabled=all.disabled=false;spin.textContent='Spin for Pick #1';status.textContent='Ready for Pick #1';render();wheel()}
spin.addEventListener('click',once);all.addEventListener('click',runAll);document.getElementById('reset').addEventListener('click',reset);reset();
</script></main></body></html>
